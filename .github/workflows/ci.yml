name: ci
on:
  push:
    paths: ["scripts/**", "tests/**", "viewer/template.html", ".github/workflows/**", "atlas/**"]
  pull_request:
    paths: ["scripts/**", "tests/**", "viewer/template.html", ".github/workflows/**", "atlas/**"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "22" }
      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy pyarrow pytest pip-audit
      - run: python -m pytest -q tests
      - name: dependency audit (D3)
        run: pip-audit --strict --desc on 2>&1 | tail -20
