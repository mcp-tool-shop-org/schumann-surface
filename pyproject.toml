[project]
name = "schumann-surface"
version = "1.0.0"
description = "Schumann resonance as a 3D time-frequency surface with event lanes and honest lagged cross-correlation, built from the Sierra Nevada ELF station's open raw archive"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]
publish = ["huggingface_hub>=0.24"]

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/schumann-surface/"
Repository = "https://github.com/mcp-tool-shop-org/schumann-surface"
Dataset = "https://huggingface.co/datasets/mcp-tool-shop/schumann-sierra-nevada"

[tool.pytest.ini_options]
testpaths = ["tests"]
